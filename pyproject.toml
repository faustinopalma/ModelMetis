[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "modelmetis"
version = "0.1.0"
description = "Local industrial audio review workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1,<1",
    "pydantic>=2.11,<3",
    "uvicorn>=0.35,<1",
    "gunicorn>=23,<24; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.11,<1"]
ml = ["numpy>=2.2,<3", "scipy>=1.15,<2", "scikit-learn>=1.6,<2"]
teacher = ["torch>=2.8,<3", "transformers>=4.51,<5", "librosa>=0.11,<1"]
llm = ["azure-identity>=1.24,<2", "httpx>=0.28,<1"]

[project.scripts]
modelmetis-api = "modelmetis.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]